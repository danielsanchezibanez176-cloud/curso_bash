<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LinuxAcademy 30 — Aprende Linux, Bash y Ciberseguridad en 30 días. Plataforma educativa interactiva con terminal virtual, laboratorios y gamificación." />
    <meta name="theme-color" content="#f6f4ed" />

    <!-- Open Graph -->
    <meta property="og:title" content="LinuxAcademy 30" />
    <meta property="og:description" content="Aprende Linux, Bash y Ciberseguridad en 30 días" />
    <meta property="og:type" content="website" />

    <!-- Fonts: JetBrains Mono (terminal) + Syne (headings) + Outfit (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Syne:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>LinuxAcademy 30 — Terminal, Bash & Ciberseguridad</title>

    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('la30_theme') || 'light';
      } catch {}
    </script>

    <!-- Prevent FOUC -->
    <style>
      html, body, #root {
        background: #f6f4ed;
        margin: 0;
        padding: 0;
      }
      #splash {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 48%, rgba(247,198,0,.18), transparent 240px),
          #f6f4ed;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      html[data-theme="dark"] #splash {
        background:
          radial-gradient(circle at 50% 48%, rgba(247,198,0,.13), transparent 240px),
          #090a0c;
      }
      .splash-tux-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: splash-arrive .55s cubic-bezier(.34,1.56,.64,1) both;
      }
      .splash-tux {
        width: 142px;
        height: auto;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 18px 14px rgba(45,35,0,.2));
        animation: tux-hello 1.15s ease-in-out infinite alternate;
      }
      .splash-dots {
        display: flex;
        gap: 7px;
        height: 12px;
      }
      .splash-dots span {
        width: 9px;
        height: 9px;
        background: #d49b00;
        border-radius: 50%;
        animation: dot-hop .8s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: .13s; }
      .splash-dots span:nth-child(3) { animation-delay: .26s; }
      @keyframes splash-arrive {
        from { opacity: 0; transform: translateY(18px) scale(.86); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes tux-hello {
        0%   { transform: translateY(0) rotate(-2deg); }
        55%  { transform: translateY(-7px) rotate(2deg); }
        100% { transform: translateY(-3px) rotate(-1deg); }
      }
      @keyframes dot-hop {
        0%, 100% { transform: translateY(0); opacity: .4; }
        50%      { transform: translateY(-5px); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-tux-wrap, .splash-tux, .splash-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash" role="status" aria-label="Cargando LinuxAcademy">
      <div class="splash-tux-wrap">
        <img class="splash-tux" src="%BASE_URL%tux-linux-transparent.png" alt="" />
        <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Remove splash after React mounts
      window.__hideSplash = function() {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 400);
        }
      };
    </script>
  </body>
</html>
